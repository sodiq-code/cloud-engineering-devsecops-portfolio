# Remove the version: "3.8" line at the top (it's obsolete)

services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: localstack_finops
    env_file:
      - .env 
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LS_TOKEN}
      - SERVICES=s3,sqs,iam,sts,wafv2,kms
      - PERSISTENCE=1 
      - DEBUG=1  # Changed to 1 so we can see more detail if it fails
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"