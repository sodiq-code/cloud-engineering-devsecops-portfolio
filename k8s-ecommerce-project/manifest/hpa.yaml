# hpa.yaml — Horizontal Pod Autoscaler for the Email Service
# Automatically scales replicas between 2 and 10 based on CPU and memory usage.
# This completes the SRE story: observe → alert → auto-scale → self-heal.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: email-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: email-service-deployment

  minReplicas: 2    # Never drop below 2 — ensures HA even at zero traffic
  maxReplicas: 10   # Cap at 10 to control cluster resource consumption

  metrics:
    # Scale out when average CPU exceeds 70% across all replicas
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale out when average memory exceeds 80% of the memory limit
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # Wait 60s before scaling up again (prevents thrashing)
      policies:
        - type: Pods
          value: 2                       # Add at most 2 pods per scale event
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 minutes before scaling down (prevents oscillation)
      policies:
        - type: Pods
          value: 1                       # Remove at most 1 pod per scale event
          periodSeconds: 60
