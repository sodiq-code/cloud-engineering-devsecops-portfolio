# Email Service — ClusterIP Service
# Internal-only endpoint; accessible only by other pods in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: ecommerce
  labels:
    app: email-service
spec:
  selector:
    app: email-service
  ports:
    - name: http
      protocol: TCP
      port: 8080                         # Port other services call
      targetPort: http                   # Named port from the Deployment container spec
  type: ClusterIP                        # Internal only — no NodePort or LoadBalancer exposure
